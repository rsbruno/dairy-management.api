name: deploy to lambda
on: [push]

jobs:
  deploy_zip:
    name: deploy lambda function
    runs-on: ubuntu-latest
    steps:
      # Checkout do código-fonte
      - name: Checkout source code
        uses: actions/checkout@v1

      # Configuração do Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # Instalação das dependências
      - name: Install dependencies
        run: npm install

      # Gerar o arquivo ZIP para implantação
      - name: Generate ZIP
        run: |
          zip -r deployment.zip *
          echo "Generated ZIP file:"
          ls -lh deployment.zip

      # Garantir que o diretório estático exista no S3
      - name: Ensure directory exists in S3
        run: |
          aws s3api head-object --bucket ${{ secrets.S3_BUCKET_NAME }} --key static/ || \
          aws s3api put-object --bucket ${{ secrets.S3_BUCKET_NAME }} --key static/
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      # Fazer upload do diretório estático para o S3
      - uses: shallwefootball/s3-upload-action@master
        name: Upload S3
        id: S3
        with:
          aws_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_bucket: ${{ secrets.S3_BUCKET_NAME }}
          source_dir: 'static'
          dest_dir: 'static/'
          region: ${{ secrets.AWS_REGION }}

      # Atualizar a função Lambda com o arquivo do S3
      - name: Update Lambda function from S3
        run: |
          aws lambda update-function-code \
            --function-name milk-erp-api \
            --s3-bucket ${{ secrets.S3_BUCKET_NAME }} \
            --s3-key deployment.zip \
            --region ${{ secrets.AWS_REGION }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}