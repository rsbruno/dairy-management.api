name: deploy to lambda
on: [push]

jobs:
  deploy_lambda:
    runs-on: ubuntu-latest
    steps:
      # Checkout do código-fonte
      - name: Checkout source code
        uses: actions/checkout@v1

      # Instalar dependências e preparar o ZIP
      - name: Install dependencies and create ZIP
        run: |
          npm install
          zip -r lambda.zip *

      # Verificar credenciais AWS
      - name: Verify AWS credentials
        run: |
          aws sts get-caller-identity
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      # Fazer upload do arquivo ZIP para o S3
      - name: Upload ZIP to S3
        run: |
          aws s3 cp lambda.zip s3://${{ secrets.S3_BUCKET_NAME }}/lambda.zip --region ${{ secrets.AWS_REGION }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      # Atualizar função Lambda
      - name: Update Lambda function
        run: |
          aws lambda update-function-code \
            --function-name milk-erp-api \
            --s3-bucket ${{ secrets.S3_BUCKET_NAME }} \
            --s3-key lambda.zip \
            --region ${{ secrets.AWS_REGION }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}