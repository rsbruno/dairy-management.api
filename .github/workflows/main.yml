name: deploy to lambda
on: [push]

jobs:
  deploy_zip:
    name: Deploy Lambda Function
    runs-on: ubuntu-latest
    steps:
      # Checkout do código-fonte
      - name: Checkout source code
        uses: actions/checkout@v1

      # Configuração do Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # Instalação das dependências
      - name: Install dependencies
        run: npm install

      # Gerar o arquivo ZIP para implantação
      - name: Generate ZIP
        run: |
          zip -r lambda.zip *
          echo "Generated ZIP file:"
          ls -lh lambda.zip

      # Fazer upload do arquivo ZIP para o S3
      - name: Upload file to bucket
        uses: a-sync/s3-uploader@master
        with:
          args: --acl public-read
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
          S3_KEY: lambda.zip
          FILE: ./lambda.zip

      # Atualizar a função Lambda com o arquivo do S3
      - name: Update Lambda function from S3
        run: |
          aws lambda update-function-code \
            --function-name milk-erp-api \
            --s3-bucket ${{ secrets.S3_BUCKET_NAME }} \
            --s3-key lambda.zip \
            --region ${{ secrets.AWS_REGION }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}